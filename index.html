<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eafcff" />
  <title>لعبة حرف الكاف - النسخة الاحترافية</title>
  <style>
    :root{
      --primary:#0f6bb5;
      --success:#34c27a;
      --danger:#ff5a6f;
      --bg1:#eafcff;
      --bg2:#fff4d4;
      --bg3:#ebffe8;
      --text:#1c2a36;
      --muted:#465b6e;
      --shadow:0 18px 40px rgba(15, 38, 52, 0.12);
    }
    *{ box-sizing:border-box; }
    html, body{
      margin:0;
      min-height:100%;
      font-family:Tahoma, Arial, sans-serif;
      background:linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      color:var(--text);
    }
    html{
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
      -webkit-tap-highlight-color:transparent;
    }
    body{
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
      padding-top:max(18px, env(safe-area-inset-top));
      padding-bottom:max(18px, env(safe-area-inset-bottom));
      padding-left:max(18px, env(safe-area-inset-left));
      padding-right:max(18px, env(safe-area-inset-right));
      overflow-x:hidden;
    }
    button{
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      min-height:48px;
    }
    .game-shell{
      width:min(1000px,100%);
      max-width:100%;
      background:rgba(255,255,255,0.86);
      border:4px solid #8ed0ff;
      border-radius:30px;
      box-shadow:var(--shadow);
      padding:24px;
      position:relative;
      overflow:hidden;
    }
    .game-shell::before,
    .game-shell::after{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      border-radius:50%;
      background:rgba(118,200,255,0.1);
      z-index:0;
    }
    .game-shell::before{ top:-90px; right:-40px; }
    .game-shell::after{ bottom:-100px; left:-60px; }
    .content{ position:relative; z-index:1; }
    .welcome{
      text-align:center;
      font-size:clamp(28px,4vw,54px);
      font-weight:bold;
      color:var(--primary);
      margin-bottom:12px;
      text-shadow:2px 2px 0 #fff;
    }
    .title{
      text-align:center;
      font-size:clamp(24px,3vw,42px);
      font-weight:bold;
      color:#0c4d82;
      margin:12px 0 10px;
    }
    .subtitle{
      text-align:center;
      font-size:clamp(18px,2vw,28px);
      color:var(--muted);
      margin-bottom:18px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }
    .badge{
      background:#edfaff;
      border:2px solid #92d4ff;
      border-radius:16px;
      padding:10px 18px;
      color:#0d5f94;
      font-weight:bold;
      font-size:18px;
    }
    .timer-wrap{
      display:flex;
      align-items:center;
      gap:8px;
      background:#f4fbff;
      border:2px solid #96d5ff;
      border-radius:16px;
      padding:10px 16px;
      color:#0d5f94;
      font-weight:bold;
      font-size:18px;
    }
    .timer-dot{
      width:16px;
      height:16px;
      border-radius:50%;
      background:#ffb703;
      box-shadow:0 0 0 5px rgba(255,183,3,0.15);
      animation:pulse 1s infinite;
    }
    @keyframes pulse{
      0%{transform:scale(1); opacity:1;}
      50%{transform:scale(1.2); opacity:0.8;}
      100%{transform:scale(1); opacity:1;}
    }
    .progress{
      width:100%;
      height:18px;
      background:#ecf8ff;
      border:2px solid #bbe1ff;
      border-radius:999px;
      overflow:hidden;
      margin-bottom:18px;
    }
    .progress-bar{
      height:100%;
      background:linear-gradient(90deg,#67d3d8,#62d3a6,#ffd166);
      width:100%;
      transition:width 1s linear;
    }
    .message{
      min-height:54px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:22px;
      font-weight:bold;
      color:#0d5f3d;
      margin:8px 0 18px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:16px;
      margin-top:10px;
    }
    .card{
      background:linear-gradient(180deg,#f7fdff,#edf7ff);
      border:3px solid #85ccff;
      border-radius:20px;
      padding:18px 14px;
      font-size:28px;
      font-weight:bold;
      font-family:inherit;
      color:#1a4570;
      cursor:pointer;
      transition:0.2s ease;
      box-shadow:0 6px 0 rgba(76,150,216,0.18);
    }
    @media (hover:hover){ .card:hover{ transform:translateY(-2px); } }
    .card.correct{
      background:linear-gradient(180deg,#dfffe9,#caefd9);
      border-color:var(--success);
    }
    .card.wrong{
      background:linear-gradient(180deg,#ffe0e7,#ffc7d6);
      border-color:var(--danger);
      animation:shake 0.4s ease;
    }
    @keyframes shake{
      0%,100%{transform:translateX(0);}
      25%{transform:translateX(-8px);}
      50%{transform:translateX(8px);}
      75%{transform:translateX(-5px);}
    }
    .row{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      gap:12px;
      margin:12px 0;
    }
    .btn{
      background:linear-gradient(#ffe56b,#ffc93d);
      border:none;
      border-radius:18px;
      color:#24313d;
      font-size:22px;
      font-weight:bold;
      font-family:inherit;
      padding:14px 24px;
      cursor:pointer;
      box-shadow:0 6px 0 #d29d00;
      transition:0.2s ease;
    }
    .btn:active{
      transform:translateY(2px);
      box-shadow:0 4px 0 #d29d00;
    }
    .btn.light{
      background:#edf9ff;
      box-shadow:0 6px 0 #8ecfff;
      color:#0d4d82;
    }
    .letter-row{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
      margin:18px 0;
    }
    .letter-btn{
      width:68px;
      height:68px;
      border-radius:18px;
      border:3px solid #8ecaff;
      background:#eefbff;
      color:#0b4e7e;
      font-size:30px;
      font-weight:bold;
      font-family:inherit;
      cursor:pointer;
    }
    .answer-box{
      min-height:88px;
      background:#f3fbff;
      border:2px dashed #94d3ff;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
      font-size:36px;
      font-weight:bold;
      color:#0a4e7d;
      padding:14px;
      margin:18px 0;
    }
    .memory-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(80px, 1fr));
      gap:12px;
      margin-top:12px;
    }
    .memory-card{
      background:linear-gradient(180deg,#f7fbff,#edf6ff);
      border:3px solid #7fcaff;
      border-radius:18px;
      min-height:110px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:bold;
      font-family:inherit;
      color:#1b4667;
      cursor:pointer;
      transition:0.2s ease;
    }
    .memory-card.flipped{
      background:linear-gradient(180deg,#deffe6,#c9f3d7);
      border-color:#4ec57a;
    }
    .emoji{
      text-align:center;
      font-size:52px;
      margin:18px 0;
    }
    /* شاشات كبيرة جداً */
    @media (min-width: 1200px) {
      .game-shell{ width:min(1100px,100%); padding:32px; }
    }

    /* تابلت */
    @media (max-width: 1024px) {
      .grid{ grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
      .memory-card{ min-height:100px; }
    }

    /* هواتف وتابلت صغير */
    @media (max-width: 700px) {
      body{ align-items:flex-start; padding:12px; padding-top:max(12px, env(safe-area-inset-top)); }
      .game-shell{ padding:16px 12px; border-width:3px; border-radius:22px; }
      .topbar{ justify-content:center; gap:8px; }
      .badge, .timer-wrap{ width:100%; justify-content:center; font-size:16px; padding:8px 12px; }
      .message{ font-size:19px; min-height:48px; }
      .grid{ grid-template-columns:repeat(2,1fr); gap:10px; }
      .card{ font-size:22px; padding:14px 8px; }
      .btn{ font-size:18px; padding:12px 18px; }
      .row .btn{ flex:1 1 140px; }
      .letter-btn{ width:58px; height:58px; font-size:26px; }
      .answer-box{ font-size:30px; min-height:72px; }
      .memory-grid{ grid-template-columns:repeat(4,1fr); gap:8px; }
      .memory-card{ font-size:20px; min-height:84px; border-radius:14px; }
      .emoji{ font-size:42px; }
    }

    /* هواتف صغيرة جداً */
    @media (max-width: 380px) {
      .memory-grid{ grid-template-columns:repeat(2,1fr); }
      .memory-card{ min-height:76px; }
      .letter-btn{ width:52px; height:52px; font-size:24px; }
      .card{ font-size:20px; }
    }

    /* هاتف بوضع أفقي */
    @media (max-height: 500px) and (orientation: landscape) {
      body{ align-items:flex-start; }
      .emoji{ margin:8px 0; font-size:36px; }
      .memory-card{ min-height:64px; }
    }

    /* تقليل الحركة لمن يفضل ذلك */
    @media (prefers-reduced-motion: reduce) {
      *{ animation:none !important; transition:none !important; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div id="game" class="content"></div>
  </div>

  <script>
    const game = document.getElementById("game");

    let audioCtx = null;
    let timerId = null;
    let stageTime = 60;
    let stageDeadline = 0;

    const stages = [
      {
        title: "المستوى 1: اختر الكلمات التي فيها الكاف",
        prompt: "اختر كل الكلمات التي تحتوي على حرف الكاف في أي مكان",
        type: "chooseWords",
        choices: ["كوب", "مكتبة", "بيت", "شجرة", "قلم", "كرة", "مكتوب", "نافذة"],
        correct: ["كوب", "مكتبة", "كرة", "مكتوب"],
        message: "ابحث عن الكلمات التي فيها حرف الكاف.",
        timeoutMessage: "انتهى الوقت! الكلمات الصحيحة هي: كوب، مكتبة، كرة، مكتوب."
      },
      {
        title: "المستوى 2: أي كلمة فيها الكاف في الوسط؟",
        prompt: "اختر الكلمة التي يوجد فيها حرف الكاف في الوسط",
        type: "positionQuiz",
        choices: ["كتاب", "مكتب", "فك", "كرة"],
        correct: "مكتب",
        message: "تذكر: الكاف في كلمة مكتب موجود في الوسط.",
        timeoutMessage: "انتهى الوقت! الجواب الصحيح هو مكتب."
      },
      {
        title: "المستوى 3: أكمل الكلمة",
        prompt: "أكمل الفراغ في كلمة: م_تبة",
        type: "fillBlank",
        options: ["ك", "ت", "ر", "ق"],
        correct: "ك",
        message: "أكمل كلمة مكتبة.",
        timeoutMessage: "انتهى الوقت! الجواب الصحيح هو الكاف."
      },
      {
        title: "المستوى 4: الكلمات التي تنتهي بالكاف",
        prompt: "اختر الكلمات التي تنتهي بحرف الكاف",
        type: "chooseWords",
        choices: ["فك", "مكتبة", "قلم", "سمك", "مطبخ", "كوكب"],
        correct: ["فك", "سمك"],
        message: "ابحث عن الكلمات التي تنتهي بالكاف.",
        timeoutMessage: "انتهى الوقت! الكلمات الصحيحة هي: فك، سمك."
      },
      {
        title: "المستوى 5: لعبة الذاكرة",
        prompt: "طابق كل صورة مع كلمتها",
        type: "memory",
        pairs: [
          { symbol: "📚", word: "كتاب" },
          { symbol: "☕", word: "كوب" },
          { symbol: "⚽", word: "كرة" },
          { symbol: "🪑", word: "كرسي" }
        ],
        message: "افتح بطاقتين: صورة وكلمتها.",
        timeoutMessage: "انتهى الوقت! انتقل إلى المستوى التالي."
      },
      {
        title: "المستوى 6: صح أم خطأ؟",
        prompt: "هل العبارة صحيحة؟",
        type: "trueFalse",
        question: "كلمة 'مكتب' تحتوي على حرف الكاف في الوسط.",
        answer: true,
        message: "حدد إذا كانت العبارة صحيحة أم خاطئة.",
        timeoutMessage: "انتهى الوقت! العبارة صحيحة."
      },
      {
        title: "المستوى 7: اختر الصورة الصحيحة",
        prompt: "اختر الصورة التي اسمها يحتوي على حرف الكاف",
        type: "imageQuiz",
        choices: [
          { icon: "✏️", label: "قلم" },
          { icon: "🏠", label: "بيت" },
          { icon: "🚗", label: "سيارة" },
          { icon: "📚", label: "مكتبة" }
        ],
        correct: "مكتبة",
        message: "اسم المكتبة يحتوي على حرف الكاف.",
        timeoutMessage: "انتهى الوقت! الجواب الصحيح هو مكتبة."
      },
      {
        title: "المستوى 8: اختر الكلمات التي تبدأ بالكاف",
        prompt: "اختر الكلمات التي تبدأ بحرف الكاف",
        type: "chooseWords",
        choices: ["قلم", "مكتبة", "كرسي", "كتاب", "بيت", "كوب"],
        correct: ["كرسي", "كتاب", "كوب"],
        message: "تذكر: الكاف هنا في أول الكلمة.",
        timeoutMessage: "انتهى الوقت! الكلمات الصحيحة هي: كرسي، كتاب، كوب."
      },
      {
        title: "المستوى 9: رتب الحروف",
        prompt: "كوّن كلمة تحتوي على الكاف",
        type: "buildWord",
        letters: ["م", "ك", "ت", "ب", "ة"],
        target: "مكتبة",
        message: "ابن كلمة مكتبة من الحروف المتاحة.",
        timeoutMessage: "انتهى الوقت! الكلمة الصحيحة هي مكتبة."
      },
      {
        title: "المستوى 10: الاختبار النهائي",
        prompt: "اختر كل الكلمات التي تحتوي على حرف الكاف",
        type: "chooseWords",
        choices: ["مكتبة", "بيضة", "قلم", "شمس", "فك", "كرسي", "حقيبة", "كتاب"],
        correct: ["مكتبة", "فك", "كرسي", "كتاب"],
        message: "هذا الاختبار النهائي! ابحث عن كل كلمة فيها حرف الكاف.",
        timeoutMessage: "انتهى الوقت! الكلمات الصحيحة هي: مكتبة، فك، كرسي، كتاب."
      }
    ];

    const state = {
      current: 0,
      score: 0,
      stageLocked: false,
      memoryOpen: [],
      memoryMatched: []
    };

    function ensureAudio() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      if (!audioCtx) audioCtx = new AudioCtor();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function playTone(freq, duration, type = "sine", volume = 0.08, delay = 0) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(volume, audioCtx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function playSuccess() {
      ensureAudio();
      [523.25, 659.25, 783.99].forEach((f, i) => playTone(f, 0.18, "triangle", 0.06, i * 0.12));
    }
    function playError() {
      ensureAudio();
      [220, 180, 140].forEach((f, i) => playTone(f, 0.18, "sawtooth", 0.06, i * 0.09));
    }
    function playLevelDone() {
      ensureAudio();
      [392, 523.25, 659.25, 783.99].forEach((f, i) => playTone(f, 0.18, "square", 0.05, i * 0.12));
    }
    function playFinish() {
      ensureAudio();
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => playTone(f, 0.15, "triangle", 0.07, i * 0.1));
    }

    function setMessage(text) {
      const msg = document.querySelector(".message");
      if (msg) msg.textContent = text;
    }

    // الانتقال الموحد للمستوى التالي: يوقف المؤقت ويقفل المستوى
    function goNext(delay) {
      clearInterval(timerId);
      state.stageLocked = true;
      setTimeout(() => {
        state.current += 1;
        renderStage();
      }, delay);
    }

    function renderIntro() {
      game.innerHTML = `
        <div class="welcome">مرحبا أيها الطلاب الشطار!</div>
        <div class="title">لعبة حرف الكاف</div>
        <div class="subtitle">الكاف في أول الكلمة، وسطها، وآخرها</div>
        <div class="emoji">🌟📚✨</div>
        <div class="row">
          <button class="btn" onclick="startGame()">ابدأ اللعبة</button>
        </div>
      `;
    }

    function startGame() {
      ensureAudio();
      state.current = 0;
      state.score = 0;
      renderStage();
    }

    function renderStage() {
      clearInterval(timerId);
      state.stageLocked = false;
      state.memoryOpen = [];
      state.memoryMatched = [];

      if (state.current >= stages.length) {
        renderFinish();
        return;
      }

      const stage = stages[state.current];
      stageTime = 60;
      stageDeadline = Date.now() + 60000;

      game.innerHTML = `
        <div class="content">
          <div class="topbar">
            <div class="badge">المستوى ${state.current + 1} من ${stages.length}</div>
            <div class="badge">النقاط: ${state.score}</div>
            <div class="timer-wrap">
              <span class="timer-dot"></span>
              <span id="timerLabel">الوقت المتبقي: 60 ث</span>
            </div>
          </div>
          <div class="progress">
            <div class="progress-bar" id="progressBar" style="width:100%;"></div>
          </div>
          <div class="title">${stage.title}</div>
          <div class="subtitle">${stage.prompt}</div>
          <div class="message">${stage.message}</div>
          ${renderStageContent(stage)}
        </div>
      `;

      startTimer();
    }

    function renderStageContent(stage) {
      switch (stage.type) {
        case "chooseWords": return renderChooseWords(stage);
        case "positionQuiz": return renderPositionQuiz(stage);
        case "fillBlank": return renderFillBlank(stage);
        case "trueFalse": return renderTrueFalse(stage);
        case "memory": return renderMemory(stage);
        case "imageQuiz": return renderImageQuiz(stage);
        case "buildWord": return renderBuildWord(stage);
        default: return "";
      }
    }

    function startTimer() {
      updateTimerUI();
      timerId = setInterval(() => {
        const remaining = Math.max(0, Math.ceil((stageDeadline - Date.now()) / 1000));
        stageTime = remaining;
        updateTimerUI();
        if (remaining <= 0) {
          clearInterval(timerId);
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const timerLabel = document.getElementById("timerLabel");
      if (timerLabel) timerLabel.textContent = `الوقت المتبقي: ${stageTime} ث`;
      const progressBar = document.getElementById("progressBar");
      if (progressBar) progressBar.style.width = `${(stageTime / 60) * 100}%`;
    }

    function handleTimeout() {
      const stage = stages[state.current];
      setMessage(stage.timeoutMessage || "انتهى الوقت!");
      playError();
      goNext(1800);
    }

    /* ---------- اختيار الكلمات ---------- */
    function renderChooseWords(stage) {
      const cards = stage.choices.map(item => `
        <button class="card" data-word="${item}" onclick="handleWordChoice('${item}')">${item}</button>
      `).join("");
      return `<div class="grid">${cards}</div>`;
    }

    function handleWordChoice(word) {
      if (state.stageLocked) return;
      const stage = stages[state.current];
      const card = document.querySelector(`[data-word="${word}"]`);
      if (!card || card.classList.contains("correct")) return;

      if (stage.correct.includes(word)) {
        card.classList.add("correct");
        state.score += 10;
        playSuccess();

        const allSelected = stage.correct.every(item => {
          const el = document.querySelector(`[data-word="${item}"]`);
          return el && el.classList.contains("correct");
        });

        if (allSelected) {
          setMessage("أحسنت! جميع الكلمات الصحيحة.");
          playLevelDone();
          goNext(1200);
        } else {
          setMessage("أحسنت! هذا صحيح.");
        }
      } else {
        card.classList.add("wrong");
        setMessage("هذه الكلمة لا تناسب الشرط، حاول مرة أخرى.");
        playError();
        setTimeout(() => card.classList.remove("wrong"), 450);
      }
    }

    /* ---------- موضع الكاف ---------- */
    function renderPositionQuiz(stage) {
      const buttons = stage.choices.map(item =>
        `<button class="btn" onclick="checkPosition('${item}','${stage.correct}')">${item}</button>`
      ).join("");
      return `<div class="row">${buttons}</div>`;
    }

    function checkPosition(selected, correct) {
      if (state.stageLocked) return;
      if (selected === correct) {
        state.score += 10;
        playSuccess();
        setMessage("إجابة صحيحة!");
        playLevelDone();
        goNext(1200);
      } else {
        playError();
        setMessage("حاول مرة أخرى. ابحث عن الكلمة التي الكاف فيها في الوسط.");
      }
    }

    /* ---------- أكمل الكلمة ---------- */
    function renderFillBlank(stage) {
      return `
        <div class="answer-box" id="fillAnswerBox">_</div>
        <div class="row">
          ${stage.options.map(opt => `
            <button class="btn" onclick="fillBlank('${opt}','${stage.correct}')">${opt}</button>
          `).join("")}
        </div>
      `;
    }

    function fillBlank(option, correct) {
      if (state.stageLocked) return;
      const box = document.getElementById("fillAnswerBox");
      if (!box) return;

      if (option === correct) {
        box.textContent = option;
        state.score += 10;
        playSuccess();
        setMessage("إجابة صحيحة! الكلمة: مكتبة");
        playLevelDone();
        goNext(1200);
      } else {
        playError();
        setMessage("هذه ليست الإجابة الصحيحة. حاول مرة أخرى.");
        box.textContent = "_";
      }
    }

    /* ---------- صح أم خطأ ---------- */
    function renderTrueFalse(stage) {
      return `
        <div class="subtitle">${stage.question}</div>
        <div class="row">
          <button class="btn" onclick="checkTrueFalse(true, ${stage.answer})">صح</button>
          <button class="btn" onclick="checkTrueFalse(false, ${stage.answer})">خطأ</button>
        </div>
      `;
    }

    function checkTrueFalse(choice, answer) {
      if (state.stageLocked) return;
      if (choice === answer) {
        state.score += 10;
        playSuccess();
        setMessage("إجابة صحيحة!");
        playLevelDone();
        goNext(1200);
      } else {
        playError();
        setMessage("حاول مرة أخرى. فكّر: أين الكاف في كلمة مكتب؟");
      }
    }

    /* ---------- لعبة الذاكرة (صورة + كلمة) ---------- */
    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderMemory(stage) {
      const deck = [];
      stage.pairs.forEach((p, i) => {
        deck.push({ id: `s${i}`, pair: i, text: p.symbol });
        deck.push({ id: `w${i}`, pair: i, text: p.word });
      });
      const cards = shuffle(deck).map(c => `
        <button class="memory-card" data-card="${c.id}" data-text="${c.text}" onclick="flipMemoryCard('${c.id}', ${c.pair})">?</button>
      `).join("");
      return `<div class="memory-grid">${cards}</div>`;
    }

    function flipMemoryCard(cardId, pair) {
      if (state.stageLocked) return;
      const card = document.querySelector(`[data-card="${cardId}"]`);
      if (!card || card.classList.contains("flipped")) return;

      card.classList.add("flipped");
      card.textContent = card.dataset.text;
      state.memoryOpen.push({ cardId, pair });

      if (state.memoryOpen.length === 2) {
        const [a, b] = state.memoryOpen;
        state.stageLocked = true;

        if (a.pair === b.pair) {
          state.score += 10;
          state.memoryMatched.push(a.pair);
          playSuccess();
          setMessage("أحسنت! هذا زوج صحيح.");

          setTimeout(() => {
            state.memoryOpen = [];
            const required = stages[state.current].pairs.length;
            if (state.memoryMatched.length === required) {
              playLevelDone();
              goNext(1000);
            } else {
              state.stageLocked = false;
            }
          }, 600);
        } else {
          playError();
          setMessage("هذا ليس نفس الزوج، حاول مرة أخرى.");
          setTimeout(() => {
            state.memoryOpen.forEach(item => {
              const el = document.querySelector(`[data-card="${item.cardId}"]`);
              if (el) {
                el.classList.remove("flipped");
                el.textContent = "?";
              }
            });
            state.memoryOpen = [];
            state.stageLocked = false;
          }, 900);
        }
      }
    }

    /* ---------- اختيار الصورة ---------- */
    function renderImageQuiz(stage) {
      return `
        <div class="row">
          ${stage.choices.map(item => `
            <button class="btn" onclick="checkImage('${item.label}', '${stage.correct}')">
              ${item.icon} ${item.label}
            </button>
          `).join("")}
        </div>
      `;
    }

    function checkImage(choice, correct) {
      if (state.stageLocked) return;
      if (choice === correct) {
        state.score += 10;
        playSuccess();
        setMessage("إجابة صحيحة!");
        playLevelDone();
        goNext(1200);
      } else {
        playError();
        setMessage("حاول مرة أخرى. هذه الكلمة ليس فيها حرف الكاف.");
      }
    }

    /* ---------- ترتيب الحروف ---------- */
    function renderBuildWord(stage) {
      const letters = stage.letters.map(ch => `
        <button class="letter-btn" onclick="appendLetter('${ch}')">${ch}</button>
      `).join("");

      return `
        <div class="letter-row">${letters}</div>
        <div class="answer-box" id="buildAnswerBox">&nbsp;</div>
        <div class="row">
          <button class="btn" onclick="checkBuildWord('${stage.target}')">تأكيد</button>
          <button class="btn light" onclick="backspaceLetter()">حذف حرف</button>
          <button class="btn light" onclick="clearBuild()">مسح</button>
        </div>
      `;
    }

    function appendLetter(ch) {
      if (state.stageLocked) return;
      const box = document.getElementById("buildAnswerBox");
      if (!box) return;
      box.textContent = box.textContent.trim() + ch;
    }

    function backspaceLetter() {
      if (state.stageLocked) return;
      const box = document.getElementById("buildAnswerBox");
      if (!box) return;
      const value = box.textContent.trim();
      box.innerHTML = value.slice(0, -1) || "&nbsp;";
    }

    function clearBuild() {
      if (state.stageLocked) return;
      const box = document.getElementById("buildAnswerBox");
      if (box) box.innerHTML = "&nbsp;";
    }

    function checkBuildWord(target) {
      if (state.stageLocked) return;
      const box = document.getElementById("buildAnswerBox");
      if (!box) return;
      const value = box.textContent.trim();

      if (value === target) {
        state.score += 10;
        playSuccess();
        setMessage("أحسنت! بنيت الكلمة بشكل صحيح.");
        playLevelDone();
        goNext(1200);
      } else {
        playError();
        setMessage("الكلمة غير صحيحة. حاول مرة أخرى.");
        box.innerHTML = "&nbsp;";
      }
    }

    /* ---------- النهاية ---------- */
    function renderFinish() {
      clearInterval(timerId);
      playFinish();
      game.innerHTML = `
        <div class="welcome">أحسنت! 🎉</div>
        <div class="title">انتهت رحلة حرف الكاف بنجاح</div>
        <div class="subtitle">أنت الآن محترف الكلمات التي فيها الكاف</div>
        <div class="emoji">🏆⭐🌟</div>
        <div class="subtitle">مجموع نقاطك: ${state.score}</div>
        <div class="row">
          <button class="btn" onclick="startGame()">العب مرة أخرى</button>
        </div>
      `;
    }

    renderIntro();
  </script>
</body>
</html>
