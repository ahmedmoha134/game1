<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لعبة حرف الكاف - النسخة الاحترافية</title>
  <style>
    :root{
      --primary:#0f6bb5;
      --secondary:#ffd95a;
      --success:#34c27a;
      --danger:#ff5a6f;
      --bg1:#eafcff;
      --bg2:#fff4d4;
      --bg3:#ebffe8;
      --text:#1c2a36;
      --muted:#465b6e;
      --card:#ffffff;
      --shadow:0 18px 40px rgba(15, 38, 52, 0.12);
      --radius:24px;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      min-height:100%;
      font-family:"Tahoma","Arial","sans-serif";
      background:linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      color:var(--text);
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
    }

    .game-shell{
      width:min(1000px,100%);
      background:rgba(255,255,255,0.86);
      border:4px solid #8ed0ff;
      border-radius:30px;
      box-shadow:var(--shadow);
      padding:24px;
      position:relative;
      overflow:hidden;
    }

    .game-shell::before,
    .game-shell::after{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      border-radius:50%;
      background:rgba(118,200,255,0.1);
      z-index:0;
    }

    .game-shell::before{
      top:-90px;
      right:-40px;
    }

    .game-shell::after{
      bottom:-100px;
      left:-60px;
    }

    .content{
      position:relative;
      z-index:1;
    }

    .welcome{
      text-align:center;
      font-size:clamp(28px,4vw,54px);
      font-weight:bold;
      color:var(--primary);
      margin-bottom:12px;
      text-shadow:2px 2px 0 #fff;
    }

    .title{
      text-align:center;
      font-size:clamp(24px,3vw,42px);
      font-weight:bold;
      color:#0c4d82;
      margin:12px 0 10px;
    }

    .subtitle{
      text-align:center;
      font-size:clamp(18px,2vw,28px);
      color:var(--muted);
      margin-bottom:18px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .badge{
      background:#edfaff;
      border:2px solid #92d4ff;
      border-radius:16px;
      padding:10px 18px;
      color:#0d5f94;
      font-weight:bold;
      font-size:18px;
    }

    .timer-wrap{
      display:flex;
      align-items:center;
      gap:8px;
      background:#f4fbff;
      border:2px solid #96d5ff;
      border-radius:16px;
      padding:10px 16px;
      color:#0d5f94;
      font-weight:bold;
      font-size:18px;
    }

    .timer-dot{
      width:16px;
      height:16px;
      border-radius:50%;
      background:#ffb703;
      box-shadow:0 0 0 5px rgba(255,183,3,0.15);
      animation:pulse 1s infinite;
    }

    @keyframes pulse{
      0%{transform:scale(1); opacity:1;}
      50%{transform:scale(1.2); opacity:0.8;}
      100%{transform:scale(1); opacity:1;}
    }

    .progress{
      width:100%;
      height:18px;
      background:#ecf8ff;
      border:2px solid #bbe1ff;
      border-radius:999px;
      overflow:hidden;
      margin-bottom:18px;
    }

    .progress-bar{
      height:100%;
      background:linear-gradient(90deg,#67d3d8,#62d3a6,#ffd166);
      width:100%;
      transition:width 1s linear;
    }

    .message{
      min-height:54px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:22px;
      font-weight:bold;
      color:#0d5f3d;
      margin:8px 0 18px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
      gap:16px;
      margin-top:10px;
    }

    .card{
      background:linear-gradient(180deg,#f7fdff,#edf7ff);
      border:3px solid #85ccff;
      border-radius:20px;
      padding:18px 14px;
      font-size:28px;
      font-weight:bold;
      color:#1a4570;
      cursor:pointer;
      transition:0.2s ease;
      box-shadow:0 6px 0 rgba(76,150,216,0.18);
    }

    .card:hover{ transform:translateY(-2px); }

    .card.correct{
      background:linear-gradient(180deg,#dfffe9,#caefd9);
      border-color:var(--success);
    }

    .card.wrong{
      background:linear-gradient(180deg,#ffe0e7,#ffc7d6);
      border-color:var(--danger);
      animation:shake 0.4s ease;
    }

    .card.selected{
      background:linear-gradient(180deg,#fff6c9,#ffe89b);
      border-color:#efb92d;
    }

    @keyframes shake{
      0%,100{transform:translateX(0);}
      25%{transform:translateX(-8px);}
      50%{transform:translateX(8px);}
      75%{transform:translateX(-5px);}
    }

    .row{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      gap:12px;
      margin:12px 0;
    }

    .btn{
      background:linear-gradient(#ffe56b,#ffc93d);
      border:none;
      border-radius:18px;
      color:#24313d;
      font-size:22px;
      font-weight:bold;
      padding:14px 24px;
      cursor:pointer;
      box-shadow:0 6px 0 #d29d00;
      transition:0.2s ease;
    }

    .btn:active{
      transform:translateY(2px);
      box-shadow:0 4px 0 #d29d00;
    }

    .mini-btn{
      background:#edf9ff;
      border:2px solid #8ecfff;
      border-radius:14px;
      padding:12px 18px;
      font-size:18px;
      font-weight:bold;
      color:#0d4d82;
      cursor:pointer;
    }

    .mini-btn.selected{
      background:#fff3b8;
      border-color:#f0b82e;
    }

    .letter-row{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
      margin:18px 0;
    }

    .letter-btn{
      width:68px;
      height:68px;
      border-radius:18px;
      border:3px solid #8ecaff;
      background:#eefbff;
      color:#0b4e7e;
      font-size:30px;
      font-weight:bold;
      cursor:pointer;
    }

    .answer-box{
      min-height:88px;
      background:#f3fbff;
      border:2px dashed #94d3ff;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
      font-size:36px;
      font-weight:bold;
      color:#0a4e7d;
      padding:14px;
      margin:18px 0;
    }

    .memory-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(110px, 1fr));
      gap:12px;
      margin-top:12px;
    }

    .memory-card{
      background:linear-gradient(180deg,#f7fbff,#edf6ff);
      border:3px solid #7fcaff;
      border-radius:18px;
      min-height:110px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:bold;
      color:#1b4667;
      cursor:pointer;
      transition:0.2s ease;
    }

    .memory-card.flipped{
      background:linear-gradient(180deg,#deffe6,#c9f3d7);
      border-color:#4ec57a;
    }

    .emoji{
      text-align:center;
      font-size:52px;
      margin:18px 0;
    }

    .hidden{
      display:none;
    }

    @media (max-width: 700px) {
      .game-shell{
        padding:18px 14px;
      }
      .topbar{
        justify-content:center;
      }
      .badge, .timer-wrap{
        width:100%;
        justify-content:center;
      }
      .card{
        font-size:22px;
      }
      .btn{
        font-size:18px;
      }
      .letter-btn{
        width:58px;
        height:58px;
        font-size:26px;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div id="game" class="content"></div>
  </div>

  <script>
    const game = document.getElementById("game");

    let audioCtx = null;
    let timerId = null;
    let stageTime = 60;
    let stageDeadline = 0;

    const stages = [
      {
        title: "المستوى 1: اختر الكلمات التي فيها الكاف",
        prompt: "اختر كل الكلمات التي تحتوي على حرف الكاف في أي مكان",
        type: "chooseWords",
        choices: ["كوب", "مكتبة", "بيت", "شجرة", "قلم", "كرة", "مكتوب", "نافذة"],
        correct: ["كوب", "مكتبة", "قلم", "كرة", "مكتوب"],
        message: "ابحث عن الكلمات التي فيها حرف الكاف.",
        timeoutMessage: "انتهى الوقت! الكلمات الصحيحة هي: كوب، مكتبة، قلم، كرة، مكتوب."
      },
      {
        title: "المستوى 2: أي كلمة فيها الكاف في الوسط؟",
        prompt: "اختر الكلمة التي يوجد فيها حرف الكاف في الوسط",
        type: "positionQuiz",
        choices: ["كتاب", "مكتب", "فك", "كوكب"],
        correct: "مكتب",
        message: "تذكر: الكاف في كلمة مكتب موجود في الوسط.",
        timeoutMessage: "انتهى الوقت! الجواب الصحيح هو مكتب."
      },
      {
        title: "المستوى 3: أكمل الكلمة",
        prompt: "أكمل الفراغ في كلمة: م_تبة",
        type: "fillBlank",
        options: ["ك", "ت", "ر", "ق"],
        correct: "ك",
        message: "أكمل كلمة مكتبة.",
        timeoutMessage: "انتهى الوقت! الجواب الصحيح هو الكاف."
      },
      {
        title: "المستوى 4: الكلمات التي تنتهي بالكاف",
        prompt: "اختر الكلمات التي تنتهي بحرف الكاف",
        type: "chooseWords",
        choices: ["فك", "مكتبة", "قلم", "خزف", "مطبخ", "كوكب"],
        correct: ["فك", "خزف"],
        message: "ابحث عن الكلمات التي تنتهي بالكاف.",
        timeoutMessage: "انتهى الوقت! الكلمات الصحيحة هي: فك، خزف."
      },
      {
        title: "المستوى 5: لعبة الذاكرة",
        prompt: "جد الأزواج المتطابقة",
        type: "memory",
        pairs: [
          { symbol: "📚", word: "كتاب" },
          { symbol: "🧩", word: "مكتبة" },
          { symbol: "☕", word: "كوب" },
          { symbol: "🎒", word: "حقيبة" }
        ],
        message: "ابحث عن الكلمات المتطابقة.",
        timeoutMessage: "انتهى الوقت! استمر في اللعب."
      },
      {
        title: "المستوى 6: صح أم خطأ؟",
        prompt: "هل العبارة صحيحة؟",
        type: "trueFalse",
        question: "كلمة 'مكتب' تحتوي على حرف الكاف في الوسط.",
        answer: true,
        message: "حدد إذا كانت العبارة صحيحة أم خاطئة.",
        timeoutMessage: "انتهى الوقت! العبارة صحيحة."
      },
      {
        title: "المستوى 7: اختر الصورة الصحيحة",
        prompt: "اختر الصورة التي اسمها يحتوي على حرف الكاف",
        type: "imageQuiz",
        choices: [
          { icon: "✏️", label: "قلم" },
          { icon: "🏠", label: "بيت" },
          { icon: "🚗", label: "سيارة" },
          { icon: "📚", label: "مكتبة" }
        ],
        correct: "مكتبة",
        message: "اسم المكتبة يحتوي على حرف الكاف.",
        timeoutMessage: "انتهى الوقت! الجواب الصحيح هو مكتبة."
      },
      {
        title: "المستوى 8: اختر الكلمات التي تبدأ بالكاف",
        prompt: "اختر الكلمات التي تبدأ بحرف الكاف",
        type: "chooseWords",
        choices: ["قلم", "مكتبة", "كرسي", "كتاب", "بيت", "فك"],
        correct: ["قلم", "كرسي", "كتاب"],
        message: "تذكر: بعض الكلمات تبدأ بالكاف.",
        timeoutMessage: "انتهى الوقت! الكلمات الصحيحة هي: قلم، كرسٍ، كتاب."
      },
      {
        title: "المستوى 9: رتب الحروف",
        prompt: "كوّن كلمة تحتوي على الكاف",
        type: "buildWord",
        letters: ["م", "ك", "ت", "ب", "ة"],
        target: "مكتبة",
        message: "ابن كلمة مكتبة من الحروف المتاحة.",
        timeoutMessage: "انتهى الوقت! الكلمة الصحيحة هي مكتبة."
      },
      {
        title: "المستوى 10: الاختبار النهائي",
        prompt: "اختر كل الكلمات التي تحتوي على حرف الكاف",
        type: "chooseWords",
        choices: ["مكتبة", "بيضة", "قلم", "شمس", "فك", "كرسي", "حقيبة", "كتاب"],
        correct: ["مكتبة", "قلم", "فك", "كرسي", "حقيبة", "كتاب"],
        message: "هذا الاختبار النهائي! كل كلمة فيها حرف الكاف.",
        timeoutMessage: "انتهى الوقت! لقد وصلت إلى النهاية."
      }
    ];

    const state = {
      current: 0,
      score: 0,
      stageLocked: false,
      memoryOpen: [],
      memoryMatched: []
    };

    function ensureAudio() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      if (!audioCtx) {
        audioCtx = new AudioCtor();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = "sine", volume = 0.08, delay = 0) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(volume, audioCtx.currentTime + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function playSuccess() {
      ensureAudio();
      [523.25, 659.25, 783.99].forEach((f, i) => playTone(f, 0.18, "triangle", 0.06, i * 0.12));
    }

    function playError() {
      ensureAudio();
      [220, 180, 140].forEach((f, i) => playTone(f, 0.18, "sawtooth", 0.06, i * 0.09));
    }

    function playLevelDone() {
      ensureAudio();
      [392, 523.25, 659.25, 783.99].forEach((f, i) => playTone(f, 0.18, "square", 0.05, i * 0.12));
    }

    function playFinish() {
      ensureAudio();
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => playTone(f, 0.15, "triangle", 0.07, i * 0.1));
    }

    function renderIntro() {
      game.innerHTML = `
        <div class="welcome">مرحبا ايها الطلاب الشطار!</div>
        <div class="title">لعبة حرف الكاف</div>
        <div class="subtitle">الكاف في أول الكلمة، وسطها، وآخرها</div>
        <div class="emoji">🌟📚✨</div>
        <div class="row">
          <button class="btn" onclick="startGame()">ابدأ اللعبة</button>
        </div>
      `;
    }

    function startGame() {
      ensureAudio();
      state.current = 0;
      state.score = 0;
      state.stageLocked = false;
      state.memoryOpen = [];
      state.memoryMatched = [];
      renderStage();
    }

    function renderStage() {
      clearInterval(timerId);

      if (state.current >= stages.length) {
        renderFinish();
        return;
      }

      const stage = stages[state.current];
      stageTime = 60;
      stageDeadline = Date.now() + 60000;

      game.innerHTML = `
        <div class="content">
          <div class="topbar">
            <div class="badge">المستوى ${state.current + 1} من ${stages.length}</div>
            <div class="badge">النقاط: ${state.score}</div>
            <div class="timer-wrap">
              <span class="timer-dot"></span>
              <span id="timerLabel">الوقت المتبقي: 60 ث</span>
            </div>
          </div>

          <div class="progress">
            <div class="progress-bar" id="progressBar" style="width:100%;"></div>
          </div>

          <div class="title">${stage.title}</div>
          <div class="subtitle">${stage.prompt}</div>
          <div class="message">${stage.message}</div>

          ${renderStageContent(stage)}
        </div>
      `;

      startTimer();
    }

    function renderStageContent(stage) {
      switch (stage.type) {
        case "chooseWords":
          return renderChooseWords(stage);
        case "positionQuiz":
          return renderPositionQuiz(stage);
        case "fillBlank":
          return renderFillBlank(stage);
        case "trueFalse":
          return renderTrueFalse(stage);
        case "memory":
          return renderMemory(stage);
        case "imageQuiz":
          return renderImageQuiz(stage);
        case "buildWord":
          return renderBuildWord(stage);
        default:
          return "";
      }
    }

    function startTimer() {
      updateTimerUI();
      timerId = setInterval(() => {
        const remainingMs = stageDeadline - Date.now();
        const remaining = Math.max(0, Math.ceil(remainingMs / 1000));
        stageTime = remaining;
        updateTimerUI();

        if (remaining <= 0) {
          clearInterval(timerId);
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const timerLabel = document.getElementById("timerLabel");
      if (timerLabel) {
        timerLabel.textContent = `الوقت المتبقي: ${stageTime} ث`;
      }

      const progressBar = document.getElementById("progressBar");
      if (progressBar) {
        const percent = (stageTime / 60) * 100;
        progressBar.style.width = `${percent}%`;
      }
    }

    function handleTimeout() {
      const stage = stages[state.current];
      const msgBox = document.querySelector(".message");
      if (msgBox) {
        msgBox.textContent = stage.timeoutMessage || "انتهى الوقت!";
      }
      playError();

      setTimeout(() => {
        state.current += 1;
        renderStage();
      }, 1500);
    }

    function renderChooseWords(stage) {
      const cards = stage.choices.map(item => {
        return `
          <button class="card" data-word="${item}" onclick="handleWordChoice('${item}', ${stage.correct.includes(item)})">
            ${item}
          </button>
        `;
      }).join("");

      return `<div class="grid">${cards}</div>`;
    }

    function handleWordChoice(word, isCorrect) {
      if (state.stageLocked) return;

      const card = document.querySelector(`[data-word="${word}"]`);
      if (!card) return;

      if (isCorrect) {
        card.classList.add("correct");
        state.score += 10;
        playSuccess();

        const stage = stages[state.current];
        const allSelected = stage.correct.every(item => {
          const el = document.querySelector(`[data-word="${item}"]`);
          return el && el.classList.contains("correct");
        });

        if (allSelected) {
          const msg = document.querySelector(".message");
          if (msg) msg.textContent = "أحسنت! جميع الكلمات الصحيحة.";
          playLevelDone();
          state.stageLocked = true;
          setTimeout(() => {
            state.current += 1;
            renderStage();
          }, 1200);
        } else {
          const msg = document.querySelector(".message");
          if (msg) msg.textContent = "أحسنت! هذا صحيح.";
          state.stageLocked = false;
        }
      } else {
        card.classList.add("wrong");
        playError();
        setTimeout(() => card.classList.remove("wrong"), 450);
      }
    }

    function renderPositionQuiz(stage) {
      const buttons = stage.choices.map(item => {
        return `<button class="btn" onclick="checkPosition('${item}','${stage.correct}')">${item}</button>`;
      }).join("");
      return `<div class="row">${buttons}</div>`;
    }

    function checkPosition(selected, correct) {
      if (state.stageLocked) return;

      if (selected === correct) {
        state.score += 10;
        state.stageLocked = true;
        playSuccess();
        const msg = document.querySelector(".message");
        if (msg) msg.textContent = "إجابة صحيحة!";
        playLevelDone();

        setTimeout(() => {
          state.current += 1;
          renderStage();
        }, 1200);
      } else {
        playError();
        const msg = document.querySelector(".message");
        if (msg) msg.textContent = "حاول مرة أخرى. الكاف في كلمة مكتب موجود في الوسط.";
      }
    }

    function renderFillBlank(stage) {
      return `
        <div class="answer-box" id="fillAnswerBox">_</div>
        <div class="row">
          ${stage.options.map(opt => `
            <button class="btn" onclick="fillBlank('${opt}','${stage.correct}')">${opt}</button>
          `).join("")}
        </div>
      `;
    }

    function fillBlank(option, correct) {
      if (state.stageLocked) return;

      const box = document.getElementById("fillAnswerBox");
      if (!box) return;

      box.textContent = option;

      if (option === correct) {
        state.score += 10;
        state.stageLocked = true;
        playSuccess();
        const msg = document.querySelector(".message");
        if (msg) msg.textContent = "إجابة صحيحة!";
        playLevelDone();
        setTimeout(() => {
          state.current += 1;
          renderStage();
        }, 1200);
      } else {
        playError();
        const msg = document.querySelector(".message");
        if (msg) msg.textContent = "هذه ليست الإجابة الصحيحة. حاول مرة أخرى.";
        box.textContent = "_";
      }
    }

    function renderTrueFalse(stage) {
      return `
        <div class="subtitle">${stage.question}</div>
        <div class="row">
          <button class="btn" onclick="checkTrueFalse(true, ${stage.answer})">صح</button>
          <button class="btn" onclick="checkTrueFalse(false, ${stage.answer})">خطأ</button>
        </div>
      `;
    }

    function checkTrueFalse(choice, answer) {
      if (state.stageLocked) return;

      if (choice === answer) {
        state.score += 10;
        state.stageLocked = true;
        playSuccess();
        const msg = document.querySelector(".message");
        if (msg) msg.textContent = "إجابة صحيحة!";
        playLevelDone();
        setTimeout(() => {
          state.current += 1;
          renderStage();
        }, 1200);
      } else {
        playError();
        const msg = document.querySelector(".message");
        if (msg) msg.textContent = "العبارة صحيحة. كلمة مكتب فيها الكاف في الوسط.";
      }
    }

    function renderMemory(stage) {
      const cards = shuffle([...stage.pairs, ...stage.pairs]).map((item, index) => {
        const key = `${item.word}-${index}`;
        return `
          <button class="memory-card" data-card="${key}" data-word="${item.word}" onclick="flipMemoryCard('${key}', '${item.word}')">
            ?
          </button>
        `;
      }).join("");

      return `<div class="memory-grid">${cards}</div>`;
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function flipMemoryCard(cardId, word) {
      if (state.stageLocked) return;

      const card = document.querySelector(`[data-card="${cardId}"]`);
      if (!card || card.classList.contains("flipped")) return;

      card.classList.add("flipped");
      card.textContent = word;

      state.memoryOpen.push({ cardId, word });

      if (state.memoryOpen.length === 2) {
        const [a, b] = state.memoryOpen;
        state.stageLocked = true;

        if (a.word === b.word) {
          state.score += 10;
          state.memoryMatched.push(a.word);
          playSuccess();
          const msg = document.querySelector(".message");
          if (msg) msg.textContent = "أحسنت! هذا زوج صحيح.";

          setTimeout(() => {
            state.memoryOpen = [];
            state.stageLocked = false;

            const required = stages[state.current].pairs.length;
            if (state.memoryMatched.length === required) {
              playLevelDone();
              setTimeout(() => {
                state.current += 1;
                renderStage();
              }, 1200);
            }
          }, 600);
        } else {
          playError();
          const msg = document.querySelector(".message");
          if (msg) msg.textContent = "هذا ليس نفس الزوج، حاول مرة أخرى.";

          setTimeout(() => {
            state.memoryOpen.forEach(item => {
              const el = document.querySelector(`[data-card="${item.cardId}"]`);
              if (el) {
                el.classList.remove("flipped");
                el.textContent = "?";
              }
            });
            state.memoryOpen = [];
            state.stageLocked = false;
          }, 900);
        }
      }
    }

    function renderImageQuiz(stage) {
      return `
        <div class="row">
          ${stage.choices.map(item => `
            <button class="btn" onclick="checkImage('${item.label}', '${stage.correct}')">
              ${item.icon} ${item.label}
            </button>
          `).join("")}
        </div>
      `;
    }

    function checkImage(choice, correct) {
      if (state.stageLocked) return;

      if (choice === correct) {
        state.score += 10;
        state.stageLocked = true;
        playSuccess();
        const msg = document.querySelector(".message");
        if (msg) msg.textContent = "إجابة صحيحة!";
        playLevelDone();

        setTimeout(() => {
          state.current += 1;
          renderStage();
        }, 1200);
      } else {
        playError();
        const msg = document.querySelector(".message");
        if (msg) msg.textContent = "حاول مرة أخرى. الاسم الصحيح هو مكتبة.";
      }
    }

    function renderBuildWord(stage) {
      const letters = stage.letters.map(ch => `
        <button class="letter-btn" onclick="appendLetter('${ch}')">${ch}</button>
      `).join("");

      return `
        <div class="letter-row">${letters}</div>
        <div class="answer-box" id="buildAnswerBox"> </div>
        <div class="row">
          <button class="btn" onclick="checkBuildWord('${stage.target}')">تأكيد</button>
        </div>
      `;
    }

    function appendLetter(ch) {
      const box = document.getElementById("buildAnswerBox");
      if (!box) return;
      const current = box.textContent.trim();
      box.textContent = current + ch;
    }

    function checkBuildWord(target) {
      if (state.stageLocked) return;

      const box = document.getElementById("buildAnswerBox");
      if (!box) return;

      const value = box.textContent.trim();

      if (value === target) {
        state.score += 10;
        state.stageLocked = true;
        playSuccess();
        const msg = document.querySelector(".message");
        if (msg) msg.textContent = "أحسنت! بنيت الكلمة بشكل صحيح.";
        playLevelDone();

        setTimeout(() => {
          state.current += 1;
          renderStage();
        }, 1200);
      } else {
        playError();
        const msg = document.querySelector(".message");
        if (msg) msg.textContent = "الكلمة غير صحيحة. حاول مرة أخرى.";
        box.textContent = " ";
      }
    }

    function renderFinish() {
      clearInterval(timerId);
      playFinish();

      game.innerHTML = `
        <div class="welcome">أحسنت! 🎉</div>
        <div class="title">انتهت رحلة حرف الكاف بنجاح</div>
        <div class="subtitle">أنت الآن محترف الكلمات التي فيها الكاف</div>
        <div class="emoji">🏆⭐🌟</div>
        <div class="subtitle">مجموع نقاطك: ${state.score}</div>
        <div class="row">
          <button class="btn" onclick="startGame()">العب مرة أخرى</button>
        </div>
      `;
    }

    renderIntro();
  </script>
</body>
</html>
